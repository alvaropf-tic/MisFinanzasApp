server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fotos de tickets: hasta 6 MB por petición (el backend corta en 5 MB por foto)
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API: al contenedor del backend por la red interna de Docker
    location /api/ {
        proxy_pass http://backend:8090;
        # $http_host conserva el puerto (:8095): Spring compara Host con Origin y, si no cuadran, lo trata como CORS
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # La IA (Groq) puede tardar unos segundos en leer un ticket
        proxy_read_timeout 90s;
    }

    # Archivos con hash en el nombre: caché larga
    location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca en caché, para que se vea la última versión al actualizar
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Aplicación de una sola página: cualquier ruta (/inicio, /finanzas…) carga index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
