<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Mis Finanzas</title>

    <base href="/" />

    <meta name="color-scheme" content="light dark" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <link rel="icon" type="image/png" href="assets/icon/favicon.png" />

    <!-- add to homescreen for ios -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <!-- Tema y color guardados (AparienciaService): se ponen antes de pintar para que no se vea un destello -->
  <script>
    try {
      var a = JSON.parse(localStorage.getItem('mf.apariencia') || '{}');
      var oscuro = a.tema === 'oscuro' || (a.tema !== 'claro' && matchMedia('(prefers-color-scheme: dark)').matches);
      if (oscuro) document.documentElement.classList.add('ion-palette-dark');
      if (a.acento && a.acento !== 'azul') document.documentElement.classList.add('acento-' + a.acento);
    } catch (e) {}
  </script>
</head>

  <body>
    <app-root></app-root>
  </body>
</html>
