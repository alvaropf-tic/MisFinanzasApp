<ion-item lines="full">
  <ion-icon
    slot="start"
    [name]="icono()"
    [color]="esIngreso() ? 'success' : 'primary'"
    [attr.aria-label]="metodo()"
  ></ion-icon>
  <ion-label>
    <h2>{{ movimiento().descripcion || categoria() }}</h2>
    <p>{{ categoria() }} · {{ metodo() }}</p>
    <p>{{ movimiento().fecha | date: 'd MMM y, HH:mm' }}</p>
  </ion-label>
  <ion-note slot="end" class="movimiento__importe" [class.movimiento__importe--ingreso]="esIngreso()">
    @if (origen(); as o) {
      <ion-icon
        [name]="o.icono"
        class="movimiento__origen"
        [attr.aria-label]="o.etiqueta"
        [title]="o.etiqueta"
      ></ion-icon>
    }
    {{ esIngreso() ? '+' : '−' }}{{ movimiento().importe | currency: 'EUR' }}
  </ion-note>
</ion-item>
