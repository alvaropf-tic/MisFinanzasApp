# ==========================================
# PERFIL DE PRODUCCIÓN
# ==========================================
# Arranque: java -jar mis-finanzas-backend.jar --spring.profiles.active=prod
#
# Variables de entorno:
#   JWT_SECRET    (obligatoria, mínimo 32 caracteres)
#   DB_URL, DB_USER, DB_PASSWORD   (opcionales, por defecto H2 en ./data/misfinanzas-prod)
#   CORS_ORIGINS  (opcional, orígenes separados por comas)
#   GROQ_API_KEY  (opcional: sin ella no hay lectura de tickets ni chat)
#   TICKETS_DIR   (opcional, carpeta de las fotos de los tickets)

# ---------- Base de datos ----------
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/misfinanzas-prod}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.show-sql=false

# ---------- Herramientas de desarrollo desactivadas ----------
spring.h2.console.enabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
app.pagina-pruebas.enabled=false

# ---------- JWT ----------
# Sin valor por defecto: si falta JWT_SECRET el servidor no arranca
jwt.secret=${JWT_SECRET}

# ---------- CORS ----------
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost,https://localhost,capacitor://localhost}

# ---------- Tickets ----------
app.tickets.directorio=${TICKETS_DIR:./data/tickets}

# ---------- Métricas ----------
# En Docker el puerto de gestión (8091) escucha en la red interna para que Prometheus lo lea; no se publica en el host
management.server.address=${MANAGEMENT_ADDRESS:127.0.0.1}
