# ==========================================
# PERFIL DE DESARROLLO (por defecto)
# ==========================================

# ---------- Base de datos H2 en archivo ----------
spring.datasource.url=jdbc:h2:file:./data/misfinanzas
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- Consola H2: http://localhost:8090/h2-console ----------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- Swagger: http://localhost:8090/swagger-ui.html ----------
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ---------- Página de pruebas: http://localhost:8090/pruebas.html ----------
app.pagina-pruebas.enabled=true

# ---------- JWT ----------
# Clave solo para desarrollo. En producción se lee de la variable de entorno JWT_SECRET
jwt.secret=mis-finanzas-clave-solo-para-desarrollo-local-2026
