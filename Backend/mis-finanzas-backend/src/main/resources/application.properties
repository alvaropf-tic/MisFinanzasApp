# ==========================================
# APLICACIÓN
# ==========================================

spring.application.name=mis-finanzas-backend

# Sin indicar perfil se arranca en desarrollo. Producción: --spring.profiles.active=prod
# La configuración de cada entorno está en application-dev.properties y application-prod.properties
spring.profiles.default=dev

# ==========================================
# SERVIDOR
# ==========================================

server.port=8090

# ==========================================
# JPA / HIBERNATE
# ==========================================

# Sin migraciones (Flyway) todavía: Hibernate crea y actualiza las tablas
spring.jpa.hibernate.ddl-auto=update

# ==========================================
# JWT
# ==========================================

# El secreto (jwt.secret) se define en cada perfil. Duración del token: 24 h
jwt.expiration=86400000

# ==========================================
# CORS
# ==========================================

# Orígenes del frontend: ionic serve (8100) y la app Android con Capacitor
app.cors.allowed-origins=http://localhost:8100,http://localhost,https://localhost,capacitor://localhost

# ==========================================
# TICKETS
# ==========================================

# Carpeta donde se guardan las imágenes de los tickets
app.tickets.directorio=./data/tickets
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Tomcat lee hasta 10 MB de una petición rechazada para poder responder 413 en vez de cortar la conexión
# (si la corta, el navegador o la app solo ven un error de red)
server.tomcat.max-swallow-size=10MB

# ==========================================
# IA: LECTURA DE TICKETS (Groq, tier gratuito)
# ==========================================

# La clave NUNCA va aquí: variable de entorno GROQ_API_KEY o el archivo secretos.properties (en .gitignore)
spring.config.import=optional:file:./secretos.properties
app.ia.groq.api-key=${GROQ_API_KEY:}
app.ia.groq.url=https://api.groq.com/openai/v1/chat/completions
# Modelo con visión del plan gratuito; "none" = sin razonamiento (respuesta directa, menos tokens)
app.ia.groq.modelo=qwen/qwen3.8-27b
app.ia.groq.razonamiento=none
# Modelo de texto para el chat: cupo gratuito propio, distinto del de los tickets
app.ia.groq.modelo-chat=openai/gpt-oss-120b

# ==========================================
# ACTUATOR / MÉTRICAS
# ==========================================

# Actuator en un puerto aparte que solo escucha en local: Prometheus lo lee sin token y desde fuera no se ve
management.server.port=8091
management.server.address=127.0.0.1
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
# /livez y /readyz también en el puerto principal (8090), solo con el estado UP/DOWN
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.info.env.enabled=true
info.app.nombre=Mis Finanzas
info.app.version=@project.version@

# ==========================================
# SWAGGER
# ==========================================

# Swagger UI ordenado alfabéticamente (se desactiva en producción)
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
